# ============================================================
#  FunkyMercado: tienda de decoración del mercado
#  Cambios: /fmercado recargar (no hace falta reiniciar)
#  Colores con & (Bedrock no tiene hex: se ve el color más parecido)
# ============================================================

# Hora de registro.log
zona-horaria: America/Mexico_City

# Solo se puede comprar DENTRO de esta caja (= región "mercado" de WorldGuard).
# Si redefinen la región, copiar aquí los mismos límites.
zona:
  activa: true
  mundo: world
  min: [-160, -64, -640]
  max: [47, 112, -417]

# Cuántos bloques trae cada compra (un stack).
cantidad: 64

# Reglas de la tienda (decididas el 2-nov):
#  - Solo VENDE, nunca compra: el dinero se destruye (sumidero).
#  - Nada que paguen los oficios (por eso no hay lana ni alfombras) y nunca tintes.
#  - Precio techo: 2-3 veces lo que cobra un jugador, para que la gente compre en los puestos.
#
# categoria -> familias -> productos. El precio va en la categoria y una familia
# puede tener su propio "precio" si algún día hace falta.
# Para que un NPC abra una categoria:
#   /npc action <npc> RIGHT_CLICK add player_command deco <categoria>
categorias:
  colores:
    titulo: '&5&lBloques de colores'
    icono: MAGENTA_GLAZED_TERRACOTTA
    precio: 200
    familias:
